<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Loader</title>
</head>
<body>

<script>
(function () {
    const params = new URLSearchParams(window.location.search);
    let id = params.get("id") || "demo1";

    // নিরাপদ filename
    if (!/^[a-zA-Z0-9_-]+$/.test(id)) {
        document.body.innerHTML = "<h2>Invalid ID</h2>";
        return;
    }

    // Same GitHub Pages repository
    const target = "../test/" + encodeURIComponent(id) + ".html";

    window.location.replace(target);
})();
</script>

</body>
</html>
